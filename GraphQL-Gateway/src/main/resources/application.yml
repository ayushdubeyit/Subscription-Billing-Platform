server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:my-super-secret-jwt-key-for-subscription-platform-2026}

spring:
  application:
    name: graphql-gateway

  graphql:
    graphiql:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: graphql-gateway