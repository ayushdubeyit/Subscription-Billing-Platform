spring.application.name=subscription-service


server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/subscription_db}
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=subscription-service

#spring.grpc.client.channels.payment-service.address=static://payment-service:9090
#spring.grpc.client.channels.payment-service.negotiation-type=PLAINTEXT
PAYMENT_GRPC_HOST=${PAYMENT_GRPC_HOST:localhost}
PAYMENT_GRPC_PORT=${PAYMENT_GRPC_PORT:9090}

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081/graphql}
billing.service.url=${BILLING_SERVICE_URL:http://localhost:8084/graphql}
# Eureka
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false